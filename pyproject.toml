[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pennylane-zksf"
version = "0.2.1"
description = "PennyLane device for the ZKSF certified quantum simulation service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zero Kelvin Simulation Foundry" }]
keywords = ["quantum", "pennylane", "simulation", "quantum-computing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["pennylane>=0.42", "httpx>=0.24", "numpy>=1.23"]

[project.urls]
Homepage = "https://zksf.org"
Documentation = "https://zksf.org/docs/"
Source = "https://github.com/official-dvl/pennylane-zksf"

[project.entry-points."pennylane.plugins"]
"zksf.simulator" = "pennylane_zksf:ZKSFDevice"

[tool.setuptools.packages.find]
include = ["pennylane_zksf*"]
