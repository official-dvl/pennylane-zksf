name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Run tests
        # The suite runs against a stub service, so no token and no network.
        run: python -m pytest tests -q

  pennylane-versions:
    name: PennyLane ${{ matrix.pennylane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pennylane: ["0.42.*", "0.43.*", "0.44.*", "0.45.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with pinned PennyLane
        # The device API and the deprecation timeline for device-level shots
        # both moved during this range, so each is exercised rather than
        # assumed compatible. 0.41 is excluded because it cannot import
        # against current autoray (NumpyMimic was removed), which is a
        # PennyLane-side incompatibility, not one this device can fix.
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
          pip install "pennylane==${{ matrix.pennylane }}"
      - run: |
          python -c "import pennylane; print('pennylane', pennylane.version())"
          python -m pytest tests -q

  build-dist:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
